  body {

    color:#eef2ff; padding:1.5rem; min-height:100vh;
  }
  .store-header {
    display:flex; flex-wrap:wrap; justify-content:space-between;
    align-items:center; margin-bottom:1.5rem; padding-bottom:1rem;

  }
  .brand { display:flex; align-items:center; gap:0.9rem; }
  .brand-icon {

    background:linear-gradient(135deg,#6d8cff,#a855f7);

    font-weight:800; font-size:1.7rem; color:#0b0f1a;
    box-shadow:0 8px 24px rgba(109,140,255,0.35);
  }
  .brand-text h1 {
    font-size:1.7rem; font-weight:800; letter-spacing:-0.5px;
    background:linear-gradient(to right,#fff,#c7d2fe);

  }
  .brand-text span { font-size:0.78rem; color:#7c8db3; letter-spacing:1px; }

  .signal-badge {
    background:#141c2c; border:1px solid #263248;
    padding:0.6rem 1.1rem; border-radius:100px; font-size:0.85rem;
    display:flex; align-items:center; gap:0.5rem; color:#b9c7e0;
  }
  .signal-dot {
    width:8px; height:8px; background:#22c55e; border-radius:50%;
    box-shadow:0 0 8px #22c55e; animation:pulse 1.8s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

  .stats { display:flex; flex-wrap:wrap; gap:0.8rem; margin-bottom:1.2rem; }
  .stat-card {
    flex:1; min-width:120px; background:#101827;
    border:1px solid #1f2a3d; border-radius:16px;
    padding:0.9rem 1rem; text-align:center;
  }
  .stat-card h3 { font-size:1.5rem; font-weight:800; color:#8ea9ff; }
  .stat-card p { font-size:0.7rem; color:#7c8db3; letter-spacing:0.5px; margin-top:0.2rem; }

  .filter-bar { display:flex; flex-wrap:wrap; gap:0.6rem; margin-bottom:1.2rem; }
  .filter-btn {
    background:#141c2c; border:1px solid #263248; color:#b9c7e0;
    padding:0.5rem 1.1rem; border-radius:100px; font-size:0.8rem;
    cursor:pointer; transition:.2s; font-weight:600;
  }
  .filter-btn:hover { background:#1c2740; color:#fff; }
  .filter-btn.active { background:#6d8cff; color:#0b0f1a; border-color:#6d8cff; }

  .grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:1rem;
  }
  .card {
    background:#101827; border:1px solid #1f2a3d; border-radius:18px;
    padding:1.1rem; cursor:pointer; transition:.2s;
    display:flex; flex-direction:column; gap:0.6rem;
    position:relative; overflow:hidden;
  }
  .card::before {
    content:''; position:absolute; top:0; left:0; width:100%; height:3px;
    background:linear-gradient(90deg,#6d8cff,#a855f7);
  }
  .card:hover {
    transform:translateY(-4px); background:#162034;
    border-color:#3b4e6b; box-shadow:0 18px 30px -12px #000;
  }
  .card-header { display:flex; justify-content:space-between; align-items:center; gap:0.4rem; }
  .item-code {

    background:#1a2438; padding:0.25rem 0.6rem; border-radius:100px;
    color:#8ea9ff; border:1px solid #2a3a55; white-space:nowrap;
  }
  .badge {
    font-size:0.65rem; font-weight:700; padding:0.25rem 0.65rem;
    border-radius:100px; letter-spacing:0.3px; white-space:nowrap;

  .badge.rare { background:#7c3aed; color:#f0e9ff; box-shadow:0 0 10px #8b5cf6aa; }
  .badge.jelek { background:#422006; color:#fbbf24; border:1px solid #b45309; }
  .badge.najis { background:#0f2e20; color:#4ade80; border:1px solid #14532d; }

  .dimension {

    padding-top:0.55rem; display:flex; justify-content:space-between; align-items:center;
    gap:0.4rem;

  .modal-overlay {

    backdrop-filter:blur(6px); display:none; align-items:center;
    justify-content:center; padding:1.5rem; z-index:1000;

/* ============ PARSER ============ */
function parseData(text) {
  const lines = text.split('\n').filter(l => l.trim().startsWith('['));
  return lines.map(line => {
    const match = line.match(/\[([^\]]+)\]\s+(\S+)\s*\|\s*ID:(\S+)\s*\|\s*UID:(\S+)\s*\|\s*(\S+)\s*\|\s*(\S+)/);
    if (!match) return null;
    return {
      kode: match[1],
      nama: match[2],
      id: match[3],
      uid: match[4],
      tipe: match[5],
      kategori: match[6].toUpperCase()
    };
  }).filter(Boolean);
}

  if (kat === 'RARE') return 'rare';
  if (kat === 'JELEKBET') return 'jelek';
  return 'najis';
}

function badgeColor(kat) {
  if (kat === 'RARE') return { bg:'#7c3aed', color:'#f0e9ff' };
  if (kat === 'JELEKBET') return { bg:'#422006', color:'#fbbf24' };
  return { bg:'#0f2e20', color:'#4ade80' };
}

        <span class="item-code">[${item.kode}]</span>

      </div>
      <div class="item-name">${item.nama}</div>

    </div>
  `).join('');

  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const idx = card.dataset.index;
      openModal(items[idx]);
    });
  });
}

function openModal(item) {
  modalTitle.textContent = item.nama;
  modalDetails.innerHTML = `
    <div class="detail-row">
      <span class="detail-label">🔖 KODE</span>
      <span class="detail-value">[${item.kode}]</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">🆔 ID</span>
      <span class="detail-value">${item.id}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">👤 UID</span>
      <span class="detail-value">${item.uid}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">📐 TIPE</span>
      <span class="detail-value">${item.tipe}</span>
    </div>
    <div class="modal-password">
      <div class="lbl">🔒 PASSWORD</div>
      <div class="val">ASTER-${item.id.slice(-6)}</div>
    </div>
  `;
  const c = badgeColor(item.kategori);
  modalBadgeContainer.innerHTML = `
    <div class="modal-category-badge" style="background:${c.bg}; color:${c.color}; border:1px solid ${c.color}33;">
      ${item.kategori}
    </div>
  `;
  modalOverlay.classList.add('active');
}

function closeModal() {
  modalOverlay.classList.remove('active');
}

modalCloseBtn.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

/* ============ FILTER ============ */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderGrid();
  });
});

/* ============ STATS ============ */
document.getElementById('totalItems').textContent = items.length;
document.getElementById('totalRare').textContent = items.filter(i => i.kategori === 'RARE').length;
document.getElementById('totalJelek').textContent = items.filter(i => i.kategori === 'JELEKBET').length;
document.getElementById('totalNajis').textContent = items.filter(i => i.kategori === 'NAJISNYO').length;

/* ============ INIT ============ */
renderGrid();
</script>
</body>
</html>
