<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />

    <title>ASTER SAESTU - Legendary / Rare / Common</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0a0e;
            min-height: 100vh;
            padding: 1.5rem 1rem 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bg-hologram {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(120, 80, 255, 0.06) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(255, 80, 200, 0.06) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, rgba(0, 200, 255, 0.03) 0%, transparent 70%),
                #0b0a0e;
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 860px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 1.2rem;
            padding: 2rem 1rem 1.5rem;
            border-radius: 2rem;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg at 50% 50%,
                    rgba(255, 0, 200, 0.03),
                    rgba(0, 200, 255, 0.03),
                    rgba(200, 0, 255, 0.03),
                    rgba(255, 200, 0, 0.03),
                    rgba(255, 0, 200, 0.03));
            animation: rotateBg 20s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateBg {
            to {
                transform: rotate(360deg);
            }
        }
        .hologram-text {
            position: relative;
            z-index: 2;
            font-size: clamp(2.8rem, 10vw, 4.8rem);
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: linear-gradient(135deg,
                    #ff6bcd, #b366ff, #4dc9f6, #ff6bcd);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: hologramShimmer 4s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 30px rgba(180, 100, 255, 0.25));
            line-height: 1.1;
        }
        @keyframes hologramShimmer {
            0% {
                background-position: 0% 50%;
                filter: drop-shadow(0 0 30px rgba(180, 100, 255, 0.25)) hue-rotate(0deg);
            }
            100% {
                background-position: 100% 50%;
                filter: drop-shadow(0 0 40px rgba(255, 100, 200, 0.25)) hue-rotate(-10deg);
            }
        }
        .sub-hologram {
            position: relative;
            z-index: 2;
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 0.4rem;
            font-weight: 300;
            background: linear-gradient(90deg,
                    rgba(255, 200, 255, 0.15),
                    rgba(200, 220, 255, 0.3),
                    rgba(255, 200, 255, 0.15));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ─── navigasi menu ─── */
        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 3rem;
            padding: 0.5rem 1rem;
        }
        .nav-link {
            display: inline-block;
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            letter-spacing: 0.06em;
            border: 1px solid transparent;
        }
        .nav-link:hover {
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.04);
        }
        .nav-link.legendary-nav {
            color: rgba(255, 215, 0, 0.5);
        }
        .nav-link.legendary-nav:hover,
        .nav-link.legendary-nav.active {
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.2);
            background: rgba(255, 215, 0, 0.06);
        }
        .nav-link.rare-nav {
            color: rgba(255, 107, 203, 0.5);
        }
        .nav-link.rare-nav:hover,
        .nav-link.rare-nav.active {
            color: #ff6bcb;
            border-color: rgba(255, 107, 203, 0.2);
            background: rgba(255, 107, 203, 0.06);
        }
        .nav-link.common-nav {
            color: rgba(74, 106, 143, 0.5);
        }
        .nav-link.common-nav:hover,
        .nav-link.common-nav.active {
            color: #7a9bcb;
            border-color: rgba(74, 106, 143, 0.2);
            background: rgba(74, 106, 143, 0.06);
        }

        /* ─── search bar ─── */
        .search-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 1.2rem;
        }
        .search-input {
            width: 100%;
            max-width: 400px;
            padding: 0.6rem 1.2rem;
            border-radius: 2.5rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.02em;
            backdrop-filter: blur(4px);
        }
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 0.04em;
        }
        .search-input:focus {
            border-color: rgba(179, 102, 255, 0.3);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 30px rgba(179, 102, 255, 0.03);
        }

        .stat-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.2rem;
            padding: 0.7rem 1.6rem;
            margin-bottom: 1.8rem;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }
        .stat-bar .total {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
        }
        .stat-bar .total span {
            color: #b366ff;
            font-weight: 700;
        }
        .stat-badges {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .stat-badge {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .stat-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-legendary {
            background: #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
        }
        .dot-rare {
            background: #ff6bcb;
            box-shadow: 0 0 12px rgba(255, 107, 203, 0.3);
        }
        .dot-common {
            background: #4a6a8f;
            box-shadow: 0 0 8px rgba(74, 106, 143, 0.15);
        }
        .stat-badge .label {
            font-weight: 400;
            color: rgba(255, 255, 255, 0.4);
        }
        .stat-badge .count {
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
        }
        .stat-badge .count.legendary-count {
            color: #ffd700;
        }
        .stat-badge .count.rare-count {
            color: #ff6bcb;
        }
        .stat-badge .count.common-count {
            color: #7a9bcb;
        }
        .wa-link-top {

            align-items: center;
            gap: 0.4rem;
            color: #4dc9f6;
            text-decoration: none;
            font-weight: 600;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            background: rgba(77, 201, 246, 0.06);
            border: 1px solid rgba(77, 201, 246, 0.1);
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }
        .wa-link-top:hover {
            background: rgba(77, 201, 246, 0.14);
            border-color: rgba(77, 201, 246, 0.25);
            color: #7ddbff;
        }
        .wa-link-top svg {

            height: 16px;
            fill: currentColor;
        }

        .section-title {

            text-transform: uppercase;
            letter-spacing: 0.2em;

        .section-title.rare-title {

        }
        .section-title.common-title {
            color: rgba(74, 106, 143, 0.5);
            border-bottom-color: rgba(255, 255, 255, 0.03);
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 0.8rem;
        }
        .item-card {

            background: rgba(255, 255, 255, 0.03);

            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .item-card:hover {

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .item-card.legendary {

            background: rgba(255, 215, 0, 0.04);
        }
        .item-card.legendary:hover {

        .item-card.rare {
            border-color: rgba(255, 107, 203, 0.2);
            background: rgba(255, 107, 203, 0.04);
        }
        .item-card.rare:hover {
            border-color: rgba(255, 107, 203, 0.5);
            background: rgba(255, 107, 203, 0.07);
            box-shadow: 0 8px 35px rgba(255, 107, 203, 0.05);
        }
        .item-card.common {
            border-color: rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.015);
        }
        .item-card.common:hover {
            border-color: rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
        }
        .item-id {
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.02em;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            position: relative;
            z-index: 1;
        }
        .item-meta {

            border-radius: 2rem;
            border: 1px solid transparent;

        .badge-legendary {
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.2);
            background: rgba(255, 215, 0, 0.06);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.05);

        .badge-rare {

        .badge-common {
            color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
        }
        .item-card .click-hint {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;

            right: 1.5rem;

            align-items: center;
            gap: 0.5rem;

            font-size: 0.8rem;

        }
        .wa-float:hover {

            background: rgba(37, 211, 102, 0.16);

        }
        .wa-float svg {

            height: 22px;

        .wa-float .label {
            display: none;

        @media (min-width: 480px) {

            }
        }

        .footer {
            margin-top: 2.5rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.06);
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .no-result {
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            padding: 2rem 0;
            font-size: 0.9rem;
            letter-spacing: 0.1em;

        @media (max-width: 540px) {

            }

            }
            .stat-bar {

            .stat-badges {

            }
            .nav-menu {
                gap: 0.4rem;
                padding: 0.4rem 0.6rem;
            }
            .nav-link {
                font-size: 0.7rem;
                padding: 0.25rem 0.7rem;
            }
            .search-input {
                font-size: 0.8rem;

            }
        }
        @media (max-width: 390px) {
            .item-grid {

            }
            .item-card {
                padding: 0.5rem 0.6rem;
            }
            .item-id {
                font-size: 0.6rem;
            }
            .item-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.2rem;
            }
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);

        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(179, 102, 255, 0.35);
        }

        html {
            scroll-behavior: smooth;
        }

                                <div class="item-meta">
                                    <span class="item-price">Rp ${priceStr}</span>
                                    <span class="badge-legendary">LEGENDARY</span>
                                    <span class="click-hint">beli</span>
                                </div>
                            </a>
                        `;
                }
                html += `</div></div>`;
            }

            // ── Rare section ──
            if (rare.length > 0) {
                html += `<div id="rare-section" style="scroll-margin-top: 80px;">`;
                html += `<div class="section-title rare-title">✦ RARE (${rare.length}) — Rp 15.000</div>`;
                html += `<div class="item-grid">`;
                for (const item of rare) {
                    const waUrl =
                        `https://wa.me/${WA_NUMBER}?text=Halo%20Admin%2C%20saya%20mau%20beli%20ID%20RARE%3A%20${item.id}%20%28Rp%2015.000%29`;
                    html += `
                            <a href="${waUrl}" target="_blank" class="item-card rare" rel="noopener">
                                <div class="item-id">${item.id}</div>
                                <div class="item-meta">
                                    <span class="item-price">Rp 15.000</span>
                                    <span class="badge-rare">RARE</span>
                                    <span class="click-hint">beli</span>
                                </div>
                            </a>
                        `;
                }
                html += `</div></div>`;
            }

            // ── Common section ──
            if (common.length > 0) {
                html += `<div id="common-section" style="scroll-margin-top: 80px;">`;
                html += `<div class="section-title common-title">▸ COMMON (${common.length}) — Rp 5.000</div>`;
                html += `<div class="item-grid">`;
                for (const item of common) {
                    const waUrl =
                        `https://wa.me/${WA_NUMBER}?text=Halo%20Admin%2C%20saya%20mau%20beli%20ID%20COMMON%3A%20${item.id}%20%28Rp%205.000%29`;
                    html += `
                            <a href="${waUrl}" target="_blank" class="item-card common" rel="noopener">
                                <div class="item-id">${item.id}</div>
                                <div class="item-meta">
                                    <span class="item-price">Rp 5.000</span>
                                    <span class="badge-common">COMMON</span>
                                    <span class="click-hint">beli</span>
                                </div>
                            </a>
                        `;
                }
                html += `</div></div>`;
            }

            if (filtered.length === 0) {
                html += `<div class="no-result">⚡ ID tidak ditemukan</div>`;
            }

            container.innerHTML = html;

            // ─── update highlight menu berdasarkan section yang terlihat ───
            const legendarySection = document.getElementById('legendary-section');
            const rareSection = document.getElementById('rare-section');
            const commonSection = document.getElementById('common-section');

            function updateActiveNav() {
                const scrollY = window.scrollY + 100;
                const sections = [
                    { el: legendarySection, nav: navLegendary },
                    { el: rareSection, nav: navRare },
                    { el: commonSection, nav: navCommon }
                ];
                let activeFound = false;
                // cari section yang sedang di-scroll
                for (const s of sections) {
                    if (s.el) {
                        const top = s.el.offsetTop;
                        const bottom = top + s.el.offsetHeight;
                        if (scrollY >= top && scrollY < bottom) {
                            s.nav.classList.add('active');
                            activeFound = true;
                        } else {
                            s.nav.classList.remove('active');
                        }
                    } else {
                        s.nav.classList.remove('active');
                    }
                }
                // jika tidak ada yang aktif, highlight yang pertama terlihat
                if (!activeFound) {
                    for (const s of sections) {
                        if (s.el) {
                            s.nav.classList.add('active');
                            break;
                        }
                    }
                }
            }

            // hapus listener lama
            window.removeEventListener('scroll', updateActiveNav);
            window.addEventListener('scroll', updateActiveNav);
            setTimeout(updateActiveNav, 100);
        }

        // ─── event search ───
        searchInput.addEventListener('input', function() {
            render(this.value);
        });

        // ─── initial render ───
        render('');
    </script>

</body>
</html>
