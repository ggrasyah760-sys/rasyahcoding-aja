<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Cinta Untukmu ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: radial-gradient(circle at 30% 20%, #4a2c2a 0%, #2b1810 60%, #1a0e08 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
    overflow-x: hidden;
    perspective: 2500px;
  }

  /* ====== MEJA ====== */
  .desk {
    position: relative;
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ====== BUKU ====== */
  .book {
    position: relative;
    width: 100%;
    max-width: 820px;
    height: 560px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
  }

  .book-inner {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    transform-style: preserve-3d;
  }

  /* ====== HALAMAN ====== */
  .page {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    padding: 45px 38px;
    background: #fdf8f0;
    box-shadow: inset 0 0 40px rgba(139, 90, 43, 0.15);
    backface-visibility: hidden;
    overflow: hidden;
    transition: transform 1.1s cubic-bezier(0.45, 0.05, 0.25, 1);
    transform-style: preserve-3d;
    border-radius: 4px 12px 12px 4px;
  }

  /* Halaman kiri */
  .page.left {
    left: 0;
    transform-origin: right center;
    border-radius: 12px 4px 4px 12px;
    box-shadow: inset -20px 0 30px -20px rgba(0,0,0,0.25),
                inset 0 0 40px rgba(139, 90, 43, 0.15);
  }

  /* Halaman kanan */
  .page.right {
    right: 0;
    transform-origin: left center;
    box-shadow: inset 20px 0 30px -20px rgba(0,0,0,0.25),
                inset 0 0 40px rgba(139, 90, 43, 0.15);
  }

  /* Garis tengah buku */
  .book::after {
    content: "";
    position: absolute;
    top: 2%;
    left: 50%;
    width: 6px;
    height: 96%;
    transform: translateX(-50%);
    background: linear-gradient(to right, rgba(0,0,0,0.15), rgba(0,0,0,0.35), rgba(0,0,0,0.15));
    border-radius: 3px;
    z-index: 40;
    pointer-events: none;
  }

  /* ====== TEKS DI HALAMAN ====== */
  .page p {
    font-size: 0.95em;
    line-height: 1.85;
    color: #4a3a2a;
    text-align: justify;
    text-indent: 24px;
    margin-bottom: 14px;
  }

  .page p:first-of-type { text-indent: 0; }

  .page strong { color: #a8324a; }

  /* Nomor halaman */
  .page-num {
    position: absolute;
    bottom: 18px;
    font-size: 0.75em;
    color: #b89b7a;
    font-style: italic;
    letter-spacing: 1px;
  }

  .page.left .page-num { left: 24px; }
  .page.right .page-num { right: 24px; }

  /* Header kecil di tiap halaman */
  .page-title {
    text-align: center;
    font-size: 0.8em;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #b89b7a;
    margin-bottom: 20px;
    font-style: italic;
  }

  /* ====== HALAMAN COVER ====== */
  .cover {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    z-index: 30;
    background: linear-gradient(135deg, #7b2d3b 0%, #5c1f2c 50%, #3d131d 100%);
    border-radius: 4px 14px 14px 4px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f4d9a8;
    box-shadow: inset -30px 0 50px -30px rgba(0,0,0,0.5),
                0 15px 40px rgba(0,0,0,0.5);
    transform-origin: left center;
    transition: transform 1.2s cubic-bezier(0.45, 0.05, 0.25, 1);
    transform-style: preserve-3d;
    cursor: pointer;
  }

  .cover.right-cover {
    right: 0;
    border-radius: 4px 14px 14px 4px;
    transform-origin: right center;
    background: linear-gradient(135deg, #3d131d 0%, #5c1f2c 50%, #7b2d3b 100%);
    justify-content: center;
    box-shadow: inset 30px 0 50px -30px rgba(0,0,0,0.5),
                0 15px 40px rgba(0,0,0,0.5);
  }

  .cover-inner {
    border: 2px solid rgba(244, 217, 168, 0.4);
    padding: 40px 25px;
    text-align: center;
    border-radius: 8px;
    width: 78%;
  }

  .cover h1 {
    font-size: 1.6em;
    font-weight: normal;
    font-style: italic;
    line-height: 1.5;
    letter-spacing: 1px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }

  .cover .ornament {
    font-size: 2em;
    margin: 18px 0;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.12); opacity: 0.85; }
  }

  .cover .hint {
    font-size: 0.72em;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.75;
    margin-top: 10px;
    font-family: sans-serif;
  }

  /* Cover belakang */
  .back-cover {
    position: absolute;
    top: 0;
    left: 0;
    width: 50%;
    height: 100%;
    background: linear-gradient(135deg, #3d131d 0%, #2a0d15 100%);
    border-radius: 14px 4px 4px 14px;
    z-index: 1;
    box-shadow: inset -20px 0 40px -20px rgba(0,0,0,0.6),
                0 20px 50px rgba(0,0,0,0.6);
  }

  /* Halaman depan cover (belakang cover utama) */
  .cover-front {
    position: absolute;
    top: 0;
    right: 0;
    width: 50%;
    height: 100%;
    background: #fdf8f0;
    border-radius: 4px 14px 14px 4px;
    z-index: 5;
    box-shadow: inset 20px 0 30px -20px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
    text-align: center;
  }

  .cover-front h2 {
    font-size: 1.3em;
    color: #a8324a;
    font-style: italic;
    font-weight: normal;
    line-height: 1.6;
  }

  .cover-front .small {
    margin-top: 20px;
    font-size: 0.8em;
    color: #b89b7a;
    font-style: italic;
    line-height: 1.8;
  }

  /* ====== NAVIGASI ====== */
  .nav {
    display: flex;
    gap: 18px;
    margin-top: 28px;
    z-index: 50;
  }

  .nav button {
    font-family: 'Georgia', serif;
    font-size: 0.95em;
    padding: 12px 26px;
    border: 1.5px solid rgba(244, 217, 168, 0.5);
    background: rgba(244, 217, 168, 0.08);
    color: #f4d9a8;
    border-radius: 40px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    backdrop-filter: blur(4px);
  }

  .nav button:hover:not(:disabled) {
    background: rgba(244, 217, 168, 0.2);
    box-shadow: 0 0 20px rgba(244, 217, 168, 0.3);
    transform: translateY(-2px);
  }

  .nav button:disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }

  /* ====== AREA KLIK GESER ====== */
  .click-zone {
    position: absolute;
    top: 0;
    height: 100%;
    width: 15%;
    z-index: 45;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .click-zone.left-zone { left: 0; }
  .click-zone.right-zone { right: 0; }

  /* ====== RESPONSIF ====== */
  @media (max-width: 700px) {
    .book { height: 620px; }
    .page { padding: 28px 20px; }
    .page p { font-size: 0.82em; line-height: 1.75; text-indent: 18px; }
    .cover h1 { font-size: 1.2em; }
    .cover-inner { padding: 28px 16px; width: 85%; }
    .nav button { padding: 10px 18px; font-size: 0.85em; }
    .cover-front h2 { font-size: 1em; }
    .cover-front .small { font-size: 0.72em; }
  }
</style>
</head>
<body>

<div class="desk">
  <div class="book" id="book">
    <div class="book-inner" id="bookInner">

      <!-- Back cover (kiri paling belakang) -->
      <div class="back-cover"></div>

      <!-- Halaman-halaman akan di-generate oleh JS -->
      <!-- Cover depan (kanan) -->
      <div class="cover right-cover" id="frontCover">
        <div class="cover-inner">
          <div class="ornament">❦</div>
          <h1>Untuk Pacarku<br>Tersayang</h1>
          <div class="ornament">❤</div>
          <div class="hint">Ketuk untuk membuka</div>
        </div>
      </div>

      <!-- Halaman pertama di sisi kanan (di balik cover) -->
      <div class="cover-front" id="coverFrontPage">
        <h2>Sebuah surat kecil<br>dari hati yang paling dalam</h2>
        <div class="small">
          "Ada banyak hal yang ingin aku sampaikan,<br>
          tapi malam ini aku hanya ingin kamu tahu<br>
          satu hal yang paling penting."
        </div>
      </div>

    </div>

    <!-- Area klik -->
    <div class="click-zone left-zone" id="zoneLeft"></div>
    <div class="click-zone right-zone" id="zoneRight"></div>
  </div>

  <div class="nav">
    <button id="btnPrev" disabled>‹ Sebelumnya</button>
    <button id="btnNext">Selanjutnya ›</button>
  </div>
</div>

<script>
/* =========================================================
   KONTEN BUKU
   Setiap objek = 1 halaman.
   Kamu bisa edit / tambah / kurangi teks di sini.
   ========================================================= */
const pages = [
  {
    title: "Halaman Pertama",
    html: `
      <p>Aku nggak tahu harus mulai dari mana, karena rasanya terlalu banyak hal yang ingin aku sampaikan tentang betapa berartinya kamu buat aku. Tapi kalau boleh jujur, sejak kamu hadir di hidupku, semuanya terasa berbeda. Ada warna baru yang nggak pernah aku kenal sebelumnya. Ada rasa hangat yang selalu menyelinap setiap kali aku ingat kamu. Dan malam ini, aku cuma ingin kamu tahu satu hal: <strong>aku benar-benar sayang sama kamu.</strong> Lebih dari yang bisa aku ungkapkan dengan kata-kata.</p>
    `
  },
  {
    title: "Rumah",
    html: `
      <p>Kalau ada satu hal yang paling aku syukuri dalam hidup ini, itu adalah dipertemukannya aku dengan kamu. Aku sering membayangkan bagaimana kalau dulu aku nggak pernah mengenalmu. Mungkin hariku akan tetap berjalan, tapi pasti terasa hampa.</p>
      <p>Karena kamu, aku belajar arti pulang. Kamu bukan cuma tempat aku bercerita, tapi juga tempat aku pulang setelah lelah menghadapi dunia yang kadang nggak baik-baik saja. <strong>Kamu adalah rumah, dan aku nggak pernah ingin pergi dari rumah itu.</strong></p>
    `
  },
  {
    title: "Semua Tentangmu",
    html: `
      <p>Aku suka semua hal tentang kamu. Aku suka caramu tersenyum, bahkan senyum kecil yang kamu sembunyikan saat malu. Aku suka caramu tertawa lepas, sampai matamu menyipit dan suaramu terdengar seperti musik paling indah yang pernah aku dengar.</p>
      <p>Aku suka caramu marah, yang katanya serem tapi bagiku menggemaskan. Aku suka caramu peduli, caramu mengingatkanku makan, caramu menyuruhku istirahat. <strong>Aku suka semua hal tentang kamu,</strong> bahkan hal-hal yang kamu sendiri nggak sadar kamu melakukannya.</p>
    `
  },
  {
    title: "Hal Kecil",
    html: `
      <p>Kamu tahu nggak, hal paling sederhana yang selalu bikin aku jatuh cinta lagi dan lagi? Itu adalah caramu hadir.</p>
      <p>Kamu nggak perlu melakukan hal-hal besar untuk membuatku bahagia. Cukup dengan kamu ada, cukup dengan pesan singkatmu di pagi hari, cukup dengan suaramu di telepon, cukup dengan kamu bilang "kamu udah makan belum?" — itu semua sudah lebih dari cukup.</p>
      <p>Karena bagiku, kebahagiaan itu bukan tentang hal-hal mewah, tapi tentang <strong>kamu yang selalu ada,</strong> bahkan di hal-hal paling kecil sekalipun.</p>
    `
  },
  {
    title: "Aku Bukan Sempurna",
    html: `
      <p>Aku tahu aku bukan laki-laki yang sempurna. Aku sering salah, sering bikin kamu kesal, sering nggak peka sama perasaanmu. Kadang aku terlalu sibuk dengan pikiranku sendiri sampai lupa bahwa kamu juga butuh diperhatikan.</p>
      <p>Tapi percayalah, semua itu bukan karena aku nggak sayang sama kamu. Justru karena aku sayang, aku ingin belajar jadi lebih baik. <strong>Karena kamu pantas mendapatkan yang terbaik,</strong> dan aku ingin menjadi bagian dari yang terbaik itu.</p>
    `
  },
  {
    title: "Terima Kasih",
    html: `
      <p>Terima kasih ya sudah bertahan sejauh ini. Terima kasih sudah sabar menghadapi sifatku yang kadang menyebalkan. Terima kasih sudah memilihku, bahkan di saat aku sendiri sulit untuk memilih diriku.</p>
      <p>Terima kasih sudah menjadi perempuan kuat yang selalu ada di sampingku, yang nggak pernah lelah menyemangatiku, yang selalu percaya bahwa aku bisa. Terima kasih untuk semua hal yang kamu lakukan, yang mungkin nggak pernah kamu sadari betapa berharganya itu bagiku.</p>
    `
  },
  {
    title: "Masa Depan",
    html: `
      <p>Aku nggak tahu apa yang akan terjadi di masa depan. Aku nggak tahu rintangan apa yang akan kita hadapi nanti. Tapi satu hal yang aku tahu pasti: <strong>aku ingin menghadapinya bersamamu.</strong></p>
      <p>Aku ingin tertawa bersamamu, menangis bersamamu, tumbuh bersamamu, dan menua bersamamu. Aku ingin semua mimpiku, kamu ada di dalamnya. Karena bagiku, masa depan yang indah itu adalah masa depan yang di dalamnya ada kamu.</p>
    `
  },
  {
    title: "Janji",
    html: `
      <p>Sayang, kalau suatu hari nanti kamu merasa lelah, merasa nggak cukup, merasa sendiri, tolong ingat satu hal: <strong>kamu nggak pernah sendiri.</strong></p>
      <p>Ada aku yang selalu siap mendengarkanmu, ada aku yang selalu siap memelukmu, ada aku yang selalu siap menjadi tempatmu bersandar. Kamu boleh jatuh, dan aku akan ada di sana untuk membantumu bangkit. Kamu boleh menangis, dan aku akan ada di sana untuk menghapus air matamu.</p>
      <p>Karena itu janjiku, dan aku akan berusaha sekuat tenaga untuk menepatinya.</p>
    `
  },
  {
    title: "Selamanya",
    html: `
      <p>Aku sayang sama kamu. Bukan sayang yang cuma di bibir, tapi sayang yang aku rasakan setiap detik, setiap menit, setiap jam, setiap hari. Sayang yang bikin aku selalu ingin jadi lebih baik, sayang yang bikin aku selalu ingin pulang ke kamu. <strong>Sayang yang nggak akan pernah pudar,</strong> nggak peduli seberapa lama waktu berlalu.</p>
      <p>Terima kasih sudah menjadi kamu. Terima kasih sudah menjadi pacarku, temanku, rumahku. <strong>Aku mencintaimu, hari ini, besok, dan selamanya.</strong></p>
      <p style="text-align:center; margin-top:30px; color:#a8324a; font-style:italic;">— Dari aku, yang selalu sayang sama kamu. ❤</p>
    `
  }
];

/* =========================================================
   LOGIKA BUKU
   ========================================================= */
const bookInner = document.getElementById('bookInner');
const frontCover = document.getElementById('frontCover');
const coverFrontPage = document.getElementById('coverFrontPage');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const zoneLeft = document.getElementById('zoneLeft');
const zoneRight = document.getElementById('zoneRight');

let currentSpread = 0; // 0 = cover tertutup
let isAnimating = false;

// Hitung total spread (setiap spread = 2 halaman)
const totalSpreads = Math.ceil(pages.length / 2) + 1;

// Buat elemen halaman dari data
const pageElements = [];

pages.forEach((data, i) => {
  const isLeft = i % 2 === 1;
  const page = document.createElement('div');
  page.className = 'page ' + (isLeft ? 'left' : 'right');
  page.innerHTML = `
    <div class="page-title">${data.title}</div>
    ${data.html}
    <div class="page-num">${i + 1}</div>
  `;
  page.style.zIndex = 20 - Math.floor(i / 2);
  bookInner.appendChild(page);
  pageElements.push(page);
});

// Atur posisi & rotasi awal semua halaman
function setupInitialState() {
  // Semua halaman kanan: tertutup di atas (flip tertutup)
  // Semua halaman kiri: tertutup di bawah (flip terbuka)
  pageElements.forEach((page, i) => {
    const isLeft = i % 2 === 1;
    if (isLeft) {
      // Halaman kiri: mulai dalam keadaan "terbuka" (terlihat)
      page.style.transform = 'rotateY(0deg)';
      page.style.zIndex = 10 - Math.floor(i / 2);
    } else {
      // Halaman kanan: mulai dalam keadaan "tertutup" (terlipat ke kanan)
      page.style.transform = 'rotateY(-180deg)';
      page.style.zIndex = 20 - Math.floor(i / 2);
    }
  });
}

setupInitialState();

// Update tombol
function updateButtons() {
  btnPrev.disabled = currentSpread === 0 || isAnimating;
  btnNext.disabled = currentSpread >= totalSpreads - 1 || isAnimating;
}

updateButtons();

// =========================================================
// FUNGSI NAVIGASI
// =========================================================

function goNext() {
  if (isAnimating || currentSpread >= totalSpreads - 1) return;
  isAnimating = true;

  if (currentSpread === 0) {
    // Buka cover
    frontCover.style.transform = 'rotateY(-180deg)';
    coverFrontPage.style.transform = 'rotateY(0deg)';
    currentSpread = 1;
    setTimeout(() => { isAnimating = false; updateButtons(); }, 1200);
  } else {
    // Balik halaman
    const rightPageIndex = (currentSpread - 1) * 2;
    const pageToFlip = pageElements[rightPageIndex];
    if (pageToFlip) {
      pageToFlip.style.transform = 'rotateY(-180deg)';
      pageToFlip.style.zIndex = 25;
    }
    currentSpread++;
    setTimeout(() => { isAnimating = false; updateButtons(); }, 1150);
  }
  updateButtons();
}

function goPrev() {
  if (isAnimating || currentSpread <= 0) return;
  isAnimating = true;

  if (currentSpread === 1) {
    // Tutup cover
    frontCover.style.transform = 'rotateY(0deg)';
    coverFrontPage.style.transform = 'rotateY(180deg)';
    currentSpread = 0;
    setTimeout(() => { isAnimating = false; updateButtons(); }, 1200);
  } else {
    // Balik halaman ke belakang
    const rightPageIndex = (currentSpread - 2) * 2;
    const pageToFlip = pageElements[rightPageIndex];
    if (pageToFlip) {
      pageToFlip.style.transform = 'rotateY(0deg)';
      pageToFlip.style.zIndex = 20 - Math.floor(rightPageIndex / 2);
    }
    currentSpread--;
    setTimeout(() => { isAnimating = false; updateButtons(); }, 1150);
  }
  updateButtons();
}

// =========================================================
// EVENT LISTENER
// =========================================================

btnNext.addEventListener('click', goNext);
btnPrev.addEventListener('click', goPrev);

// Klik area kanan = next, kiri = prev
zoneRight.addEventListener('click', goNext);
zoneLeft.addEventListener('click', goPrev);

// Klik cover untuk buka
frontCover.addEventListener('click', (e) => {
  e.stopPropagation();
  if (currentSpread === 0) goNext();
});

// Swipe support (mobile)
let touchStartX = 0;
let touchStartY = 0;

document.getElementById('book').addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.getElementById('book').addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0) goNext();
    else goPrev();
  }
}, { passive: true });

// Keyboard support
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goPrev();
});
</script>

</body>
</html>
